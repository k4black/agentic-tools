# tdd-plus: tdd loop with TWO independent critics (codex, then GLM via opencode)
# Pattern: Planner -> Builder -> Critic chain, fail-closed at every hat (makers
# default to blocked, critics default to rejected). One vertical slice per
# iteration. Single-critic variant: tdd.yml.
#
# METHOD lives in the `test-driven-dev` skill (seams, vertical slices, red->green, no
# refactor phase). Headless deviation, since there is no user to pre-agree
# seams with: an approved design doc stands in for that agreement; with only
# a rough description the planner picks conservative seams and records them
# in plan.md as the working agreement, flagged "(headless call — revisit)".
#
# Backends: claude plans and builds, codex reviews first, opencode (GLM) second.
#
# Payload envelope: every event carries JSON
#   {spec_dir, slice: {id, description, seam, test_obligation}, files?, review_path?, verdict?}
# Each hat echoes every field it received and adds its own.
#
# Usage (bare -H names don't resolve YAML presets — pass the path):
#   ralph run -H ~/.config/ralph/presets/tdd-plus.yml -p "Implement docs/design/2026-07-19-rate-limiter.md"
# Runtime limits and required_events belong in the project ralph.yml
# (see ../templates/ralph.yml) — set required_events: ["slice.done"].

name: "TDD Plus"
description: "Red-green vertical slices per the test-driven-dev skill; codex and GLM critics review in sequence, fail-closed."

event_loop:
  starting_event: "build.start"
  completion_promise: "LOOP_COMPLETE"

events:
  slice.ready:
    description: "Planner picked the next vertical slice for the builder"
  review.ready:
    description: "Builder finished a slice; first (codex) review begins"
  review.second:
    description: "First reviewer passed; second (GLM) reviewer takes over"
  review.rejected:
    description: "A critic objected; builder fixes the same slice"
  slice.done:
    description: "Slice passed both reviews; planner commits and advances"
  planning.blocked:
    description: "Planner could not decompose or safely commit — intentional dead-end, human attention needed"
  build.blocked:
    description: "Builder could not complete the slice — intentional dead-end, human attention needed"

hats:
  planner:
    name: "🗺️ Slice Planner"
    description: "Turns the spec into agreed seams and vertical slices; advances the queue; owns completion."
    backend: claude
    triggers: ["build.start", "slice.done"]
    publishes: ["slice.ready", "planning.blocked", "LOOP_COMPLETE"]
    default_publishes: "planning.blocked"
    instructions: |
      ## PLANNER MODE — Seams And Vertical Slices

      Follow the `test-driven-dev` skill (read its SKILL.md) for what seams and vertical
      slices mean. You decompose; you never implement or review.

      Every event you emit carries the JSON envelope
      {spec_dir, slice: {id, description, seam, test_obligation}} — echo
      fields you received, never drop them.

      ### On build.start
      1. Read the source of truth from the objective: a design doc path
         (docs/design/yyyy-MM-dd-<slug>.md, per the design-doc skill) or a
         rough description.
      2. Study the codebase around the touched area: test conventions, runner
         commands, similar features.
      3. Write .ralph/specs/<task>/plan.md:
         - **Seams** — the skill requires seams pre-agreed with the user;
           headless, an approved design doc stands in for that agreement, so
           take them from it verbatim. With only a rough description, choose
           the most conservative public seams and record them in plan.md as
           the working agreement, flagged "(headless call — revisit)".
         - **Slices** — numbered vertical slices per the skill; include
           failure-path slices, not only happy paths.
      4. Write progress.md (Current slice / Done / Notes).
      5. Emit slice.ready with the envelope for slice 1, then stop.

      ### On slice.done
      1. Commit the reviewed slice: stage EXACTLY the files listed in the
         envelope's files (never .ralph/ paths). If unrelated dirty files
         would be swept, or a listed file you cannot attribute to the slice,
         emit planning.blocked instead of guessing. Conventional message
         (feat/fix/test as fits), first line <=72 chars, no body.
      2. Update progress.md; emit slice.ready with the next slice's envelope.
      3. If no slices remain: run the FULL test suite once more yourself.
         Green -> emit LOOP_COMPLETE. Anything red -> add a fix slice and emit
         slice.ready instead. Prefer one more iteration over a premature finish.

      If you cannot decompose or advance, emit planning.blocked with what you
      tried (also the default if you fail to emit — the loop stops rather
      than advancing on an empty payload).

      ### Constraints
      - You MUST NOT write implementation or test code.
      - You MUST NOT create slices for work nobody asked for (YAGNI).

  builder:
    name: "🔴🟢 Builder"
    description: "Implements exactly one slice per iteration, strict red -> green."
    backend: claude
    triggers: ["slice.ready", "review.rejected"]
    publishes: ["review.ready", "build.blocked"]
    default_publishes: "build.blocked"
    instructions: |
      ## BUILDER MODE — Red -> Green For One Slice

      Follow the `test-driven-dev` skill (read its SKILL.md) — it is the method; the loop
      rules here only bind it to the queue:

      1. Search the codebase first — do not assume something is missing
         because you haven't seen it. Manage your context with subagents: fan
         out PARALLEL read-only research subagents (current implementation,
         conventions, similar features) and keep only their conclusions.
      2. RED: ONE failing test for the envelope's slice, through its seam,
         failing for the expected reason. GREEN: minimal full implementation —
         no stubs, placeholders, or test-shaped hardcoding. No refactor step.
      3. Run the focused tests plus the strongest cheap check the repo has
         (typecheck/lint). Note commands and results in progress.md.
      4. Emit review.ready echoing the envelope plus files (every path you
         touched), then stop.

      ### On review.rejected
      Fix the critic's numbered findings for the SAME slice, re-run the
      checks, emit review.ready again — the full review chain re-runs.

      ### Constraints
      - You MUST NOT implement more than the envelope's slice or work ahead.
      - You MUST NOT write implementation before the failing test exists.
      - You MUST NOT commit — the planner commits reviewed slices.
      - If blocked (missing dependency, broken environment), emit
        build.blocked with what you tried (also the default if you fail to
        emit — the loop stops rather than advancing on an empty payload).
      - Save durable learnings (patterns, fixes, commands) to memories.

  critic-codex:
    name: "🧪 Codex Critic"
    description: "First fresh-eyes reviewer; re-runs everything; rejection is the default."
    backend: codex
    triggers: ["review.ready"]
    publishes: ["review.second", "review.rejected"]
    default_publishes: "review.rejected"
    instructions: |
      ## CRITIC MODE — first gate

      You are not the builder. Do not trust any claim in the payload; the
      envelope tells you the slice, seam, test obligation, and files.

      If your harness supports subagents, fan out PARALLEL review subagents
      over different perspectives — correctness, security/failure paths,
      simplicity/YAGNI, test honesty — and merge their findings into one
      verdict yourself. Otherwise cover the perspectives in sequential passes.

      1. **Re-run the tests yourself** — the focused ones, then the broader
         suite if the change crosses a boundary.
      2. **Verify RED really happened**: would the new test fail without the
         new implementation? If it never exercised the seam, reject.
      3. **Test quality** (per the `test-driven-dev` skill): through the agreed seam,
         asserts observable behavior, not tautological or internals-coupled.
      4. **Implementation quality**: complete (no stubs), minimal (no YAGNI
         extras), native to the codebase's patterns.
      5. **Slice fidelity**: matches the envelope's slice description — no
         silent narrowing, no working ahead. Check files for paths that
         don't belong to the slice.

      Ralph sets $RALPH_BIN — emit with "$RALPH_BIN" emit. Reject ->
      review.rejected with numbered, concrete findings (file:line, what is
      wrong, what would fix it). Pass -> review.second. Either way echo the
      full envelope plus your review notes, and stop immediately after
      emitting.

      ### Constraints
      - You MUST NOT approve with "minor issues to fix later".
      - You MUST NOT fix the code yourself.
      - You MUST NOT reject because future slices are not implemented yet —
        judge the slice against its own description.

  critic-glm:
    name: "🧿 GLM Critic"
    description: "Second, independent reviewer (different model family); rejection is the default."
    backend: opencode
    # --auto: auto-approve permissions — required because ralph spills large
    # prompts to a temp file outside the workspace that opencode must read.
    # The critic is read-only by instruction; sandbox the loop for real autonomy.
    backend_args: ["--auto", "--model", "openrouter/z-ai/glm-5.2"]
    triggers: ["review.second"]
    publishes: ["slice.done", "review.rejected"]
    default_publishes: "review.rejected"
    instructions: |
      ## CRITIC MODE — second gate

      A first reviewer already passed this slice — do NOT rubber-stamp their
      verdict; your value is an independent read from a different model
      family. Do not trust any claim in the payload; the envelope tells you
      the slice, seam, test obligation, and files.

      If your harness supports subagents, fan out PARALLEL review subagents
      over different perspectives and merge their findings yourself; otherwise
      cover the perspectives in sequential passes.

      1. Re-run the focused tests yourself.
      2. Verify the new test actually exercises the envelope's seam and would
         fail without the new implementation.
      3. Test quality (per the `test-driven-dev` skill): observable behavior, not
         internals; not tautological.
      4. Implementation quality: complete, minimal, native to the codebase.
      5. Slice fidelity against the envelope — no silent narrowing, no
         working ahead, no unrelated paths in files.

      Ralph sets $RALPH_BIN — emit with "$RALPH_BIN" emit. Reject ->
      review.rejected with numbered, concrete findings (file:line, what is
      wrong, what would fix it). Pass -> slice.done. Either way echo the full
      envelope plus your verdict, and stop immediately after emitting.

      ### Constraints
      - You MUST NOT approve with "minor issues to fix later".
      - You MUST NOT fix the code yourself.
      - You MUST NOT reject because future slices are not implemented yet.
